spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
        - id: user-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/users/**
        - id: account-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/accounts/**
        - id: transaction-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/transactions/**
        - id: reporting-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/reports/**
        - id: payment-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/payments/**
        - id: notification-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/notifications/**
  redis:
    host: localhost
    port: 6379

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
